<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Usage Dashboard</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
<style>
:root{--black:#080B0F;--s1:#0E1318;--s2:#141B22;--s3:#1C2530;--border:#232E3C;--borderlit:#2E3E52;--slate4:#7A8EA6;--slate3:#9BAFC7;--slate2:#C4D3E3;--white:#F0F5FA;--cyan:#00D4FF;--green:#44DD88;--red:#ff7070;--amber:#ffc861;--dsp:'Space Grotesk',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--slate2);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--dsp);color:var(--white);letter-spacing:-.02em}
a{color:var(--cyan);text-decoration:none}
button{cursor:pointer;font-family:var(--body);border:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;border-bottom:1px solid var(--border);background:var(--s1);position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--dsp);font-weight:700;font-size:17px;color:var(--white)}
.who{font-size:12px;color:var(--slate4);display:flex;align-items:center;gap:12px}
.who b{color:var(--slate2);font-weight:600}
.btn{background:var(--cyan);color:var(--black);border-radius:8px;padding:8px 16px;font-weight:700;font-size:13px;font-family:var(--dsp)}
.btn.ghost{background:var(--s3);color:var(--white);border:1px solid var(--borderlit)}
.wrap{max-width:1180px;margin:0 auto;padding:26px}
.crumbs{font-size:13px;color:var(--slate4);margin-bottom:6px}
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.viewhead h1{font-size:26px}.viewhead .sub{font-size:13px;color:var(--slate4);margin-top:4px}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 11px;border-radius:100px;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);color:var(--cyan)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.kpi .l{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--slate4);margin-bottom:8px}
.kpi .v{font-size:28px;font-weight:700;font-family:var(--dsp);color:var(--white);letter-spacing:-.03em}
.kpi .d{font-size:12px;margin-top:4px;color:var(--slate4)}.kpi .d.g{color:var(--green)}.kpi .d.r{color:var(--red)}.kpi .d.a{color:var(--amber)}
.card{background:var(--s2);border:1px solid var(--border);border-radius:12px;margin-bottom:22px;overflow:hidden}
.card-hd{padding:16px 20px;border-bottom:1px solid var(--border);background:var(--s3);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card-hd h3{font-size:15px}.card-hd .meta{font-size:12px;color:var(--slate4)}
.pool{padding:20px}
.pool-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.pool-top .big{font-size:22px;font-weight:700;font-family:var(--dsp);color:var(--white)}.pool-top .small{font-size:13px;color:var(--slate4)}
.bar{height:12px;border-radius:8px;background:var(--s3);overflow:hidden;border:1px solid var(--border)}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#0099BB,#00D4FF);border-radius:8px}
.bar.over>span{background:linear-gradient(90deg,#cc5555,#ff7070)}
.pool-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--slate4);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--slate4);padding:12px 20px;border-bottom:1px solid var(--border);background:var(--s3)}
tbody td{padding:13px 20px;border-bottom:1px solid var(--border);color:var(--slate2)}
tbody tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer;transition:background .12s}tbody tr.click:hover{background:var(--s3)}
.name{color:var(--white);font-weight:600}.mono{font-family:var(--dsp);font-weight:600}.muted{color:var(--slate4)}
.tag{font-size:11px;padding:2px 9px;border-radius:100px;font-weight:600}
.tag.ok{background:rgba(68,221,136,.12);color:var(--green)}.tag.warn{background:rgba(255,200,97,.12);color:var(--amber)}.tag.over{background:rgba(255,112,112,.12);color:var(--red)}
.tag.booked{background:rgba(68,221,136,.12);color:var(--green)}.tag.message{background:rgba(255,200,97,.12);color:var(--amber)}.tag.no_booking{background:rgba(255,112,112,.12);color:var(--red)}.tag.transferred{background:rgba(0,212,255,.12);color:var(--cyan)}.tag.other{background:var(--s3);color:var(--slate3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.back{font-size:13px;color:var(--cyan);cursor:pointer;margin-bottom:14px;display:inline-block}
/* login */
.login{max-width:400px;margin:8vh auto;background:var(--s2);border:1px solid var(--borderlit);border-radius:14px;overflow:hidden}
.login-hd{padding:24px;border-bottom:1px solid var(--border);text-align:center}
.login-hd h2{font-size:20px;margin-top:10px}.login-hd p{font-size:13px;color:var(--slate4);margin-top:4px}
.login-bd{padding:24px}
.fld{margin-bottom:14px}.fld label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--slate4);margin-bottom:6px}
.fld input{width:100%;padding:11px 13px;background:var(--s3);border:1px solid var(--border);border-radius:8px;color:var(--white);font-size:14px;outline:none}
.fld input:focus{border-color:var(--cyandim)}
.msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none}
.msg.err{background:rgba(255,112,112,.1);color:var(--red);display:block}
.msg.ok{background:rgba(68,221,136,.1);color:var(--green);display:block}
.lnk{font-size:12px;color:var(--slate4);text-align:center;margin-top:14px}.lnk a{cursor:pointer}
.center{text-align:center;padding:60px 20px;color:var(--slate4)}
/* product switcher + brand-agnostic accent tints (recolor via --cyan) */
.ptabs{display:flex;gap:6px;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:3px}
.ptab{background:transparent;color:var(--slate4);border-radius:7px;padding:6px 14px;font-weight:700;font-size:12px;font-family:var(--dsp);letter-spacing:.02em}
.ptab.on{background:var(--s3);color:var(--white);box-shadow:inset 0 0 0 1px var(--borderlit)}
.pill{background:color-mix(in srgb,var(--cyan) 12%,transparent);border-color:color-mix(in srgb,var(--cyan) 34%,transparent)}
.tag.transferred{background:color-mix(in srgb,var(--cyan) 12%,transparent)}
.kpi .v.acc{color:var(--cyan)}
.note{font-size:12px;color:var(--slate4);margin-top:10px;line-height:1.5}
.lanebadge{display:inline-flex;align-items:center;gap:7px;font-family:var(--dsp);font-weight:700;font-size:13px;color:var(--cyan);background:color-mix(in srgb,var(--cyan) 10%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);border-radius:100px;padding:5px 13px}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"><div class="center">Loading…</div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ===== CONFIG (public keys — safe in frontend; RLS protects data) ===== */
const SUPABASE_URL = 'https://ughcoidratfajzujpykp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8a29mWTXeWUneRQL_EEc8w_uskN3iyx';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===== GHL AGENCY EMBED =====
   /agency-embed is the GoHighLevel Custom Page. It is the ONLY framable route.
   Hard rule (fresh-handshake gate): in embed mode we NEVER render from a
   persisted Supabase session. The dashboard is painted only after a fresh GHL
   SSO handshake succeeds on THIS load, so a hostile page that iframes this
   route can't ride a still-valid session — its parent can't answer
   REQUEST_USER_DATA with a payload our edge function will decrypt. */
const SSO_FN = SUPABASE_URL + '/functions/v1/ghl-sso-link';
const BILLING_FN = SUPABASE_URL + '/functions/v1/agency-billing';
const EMBED = location.pathname.replace(/\/+$/,'') === '/agency-embed';
let EMBED_VERIFIED = false;      // true only after a fresh SSO handshake this load

const TIER = { starter:{pool:2500,price:297,ovg:.07}, growth:{pool:6000,price:497,ovg:.07}, scale:{pool:12000,price:997,ovg:.05} };

/* ===== PER-LOCATION PRIMARY LANGUAGE =====================================
   Open BCP-47 codes — the model supports all 97. The dropdown surfaces a
   curated set first (US-market demand order) then the rest A–Z; native
   type-ahead handles search. This sets only the greeting default + SMS/recap
   language, never the live conversation (which auto-mirrors the caller). */
const LANGUAGES={"af":"Afrikaans","ak":"Akan","sq":"Albanian","am":"Amharic","ar":"Arabic","hy":"Armenian","as":"Assamese","az":"Azerbaijani","eu":"Basque","be":"Belarusian","bn":"Bengali","bs":"Bosnian","bg":"Bulgarian","my":"Burmese","ca":"Catalan","ceb":"Cebuano","zh":"Chinese","hr":"Croatian","cs":"Czech","da":"Danish","nl":"Dutch","en":"English","et":"Estonian","fo":"Faroese","fil":"Filipino","fi":"Finnish","fr":"French","gl":"Galician","ka":"Georgian","de":"German","el":"Greek","gu":"Gujarati","ha":"Hausa","iw":"Hebrew","hi":"Hindi","hu":"Hungarian","is":"Icelandic","id":"Indonesian","ga":"Irish","it":"Italian","ja":"Japanese","kn":"Kannada","kk":"Kazakh","km":"Khmer","rw":"Kinyarwanda","ko":"Korean","ku":"Kurdish","ky":"Kyrgyz","lo":"Lao","lv":"Latvian","lt":"Lithuanian","mk":"Macedonian","ms":"Malay","ml":"Malayalam","mt":"Maltese","mi":"Maori","mr":"Marathi","mn":"Mongolian","ne":"Nepali","no":"Norwegian","or":"Odia","om":"Oromo","ps":"Pashto","fa":"Persian","pl":"Polish","pt":"Portuguese","pa":"Punjabi","qu":"Quechua","ro":"Romanian","rm":"Romansh","ru":"Russian","sr":"Serbian","sd":"Sindhi","si":"Sinhala","sk":"Slovak","sl":"Slovenian","so":"Somali","st":"Southern Sotho","es":"Spanish","sw":"Swahili","sv":"Swedish","tg":"Tajik","ta":"Tamil","te":"Telugu","th":"Thai","tn":"Tswana","tr":"Turkish","tk":"Turkmen","uk":"Ukrainian","ur":"Urdu","uz":"Uzbek","vi":"Vietnamese","cy":"Welsh","fy":"Western Frisian","wo":"Wolof","yo":"Yoruba","zu":"Zulu"};
const CURATED_LANGS=[["en","English"],["es","Spanish"],["zh","Chinese"],["fil","Tagalog"],["vi","Vietnamese"],["ar","Arabic"],["fr","French"],["ko","Korean"],["pt","Portuguese"],["ru","Russian"]];
function __langOptionsHtml(current){
  current = current || 'en';
  const curatedCodes = new Set(CURATED_LANGS.map(c=>c[0]));
  const opt = (code,label)=>`<option value="${code}"${code===current?' selected':''}>${esc(label)}</option>`;
  const common = CURATED_LANGS.map(([c,l])=>opt(c,l)).join('');
  const rest = Object.entries(LANGUAGES).filter(([c])=>!curatedCodes.has(c))
    .sort((a,b)=>a[1].localeCompare(b[1])).map(([c,l])=>opt(c,l)).join('');
  return `<optgroup label="Common">${common}</optgroup><optgroup label="All languages">${rest}</optgroup>`;
}
/* ===== CLIENT REBILLING (Stripe Connect Express) ========================
   Agency bills its own end clients a flat monthly retainer per location. FRV
   takes no cut (direct charges on the agency's connected account). All calls go
   to the stripe-rebilling edge fn with the caller's token; the client never
   logs into FRV — they just get a copyable Stripe Checkout link. */
const REBILLING_FN = SUPABASE_URL + '/functions/v1/stripe-rebilling';
async function __rbPost(payload){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return {ok:false,status:401,body:{error:'session expired'}};
  const res = await fetch(REBILLING_FN, { method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token},
    body: JSON.stringify(payload) });
  let body={}; try{ body=await res.json(); }catch{}
  return {ok:res.ok,status:res.status,body:body||{}};
}
const __money = c => '$'+(Number(c||0)/100).toFixed(2);

// ----- Agency-level: connect Stripe + optional default retainer -----
window.__rbLoadAgencyStatus = async function(agencyId){
  const el=document.getElementById('rbAgencyStatus'); if(!el) return;
  const r=await __rbPost({action:'connect_status', agency_id:agencyId});
  if(!r.ok||!r.body.ok){ el.innerHTML='<span class="muted">Could not load Stripe status.</span>'; return; }
  if(!r.body.connected){
    el.innerHTML=`<span class="tag no_booking">Not connected</span> <button class="btn" onclick="__rbConnect('${agencyId}')">Connect Stripe</button>
      <div class="meta" style="margin-top:8px">Connect your own Stripe account (Stripe-hosted Express onboarding) to bill your clients. FlatRateVoice never touches the money and takes no cut.</div>`;
  } else if(!r.body.charges_enabled){
    el.innerHTML=`<span class="tag warn">Setup incomplete</span> <button class="btn" onclick="__rbConnect('${agencyId}')">Finish setup</button>
      <div class="meta" style="margin-top:8px">Stripe still needs a few details before you can charge clients.</div>`;
  } else {
    el.innerHTML=`<span class="tag booked">✓ Connected</span> <span class="meta">Payouts ${r.body.payouts_enabled?'enabled':'pending'} · account <span class="mono">${esc(r.body.account)}</span></span>`;
  }
};
window.__rbConnect = async function(agencyId){
  const r=await __rbPost({action:'connect_start', agency_id:agencyId});
  if(r.ok && r.body.ok && r.body.url){ window.location.href = r.body.url; }
  else { const el=document.getElementById('rbAgencyStatus'); if(el) el.innerHTML='<span class="muted">Could not start Stripe onboarding: '+esc((r.body&&r.body.error)||r.status)+'</span>'; }
};
window.__rbSaveDefault = async function(agencyId){
  const inp=document.getElementById('rbDefault'), msg=document.getElementById('rbDefaultMsg');
  const dollars=(inp.value||'').trim();
  const cents = dollars==='' ? '' : Math.round(parseFloat(dollars)*100);
  const r=await __rbPost({action:'set_default_retainer', agency_id:agencyId, default_client_retainer_cents:cents});
  if(msg){ msg.style.display='block'; msg.className='msg '+(r.ok&&r.body.ok?'ok':'err');
    msg.textContent = r.ok&&r.body.ok ? '✓ Default saved.' : ((r.body&&r.body.error)||'Save failed.'); }
};

// ----- Location-level: opt-in, generate link, pause/resume -----
window.__rbLoadLocation = async function(ghlLocationId, locationId, agencyId){
  const box=document.getElementById('rbLocBox'); if(!box) return;
  const [{data:sub}, {data:ag}, status] = await Promise.all([
    sb.from('client_subscriptions').select('*').eq('location_id',locationId).maybeSingle(),
    sb.from('agencies').select('default_client_retainer_cents').eq('id',agencyId).maybeSingle(),
    __rbPost({action:'connect_status', agency_id:agencyId})
  ]);
  const connected = status.ok && status.body.ok && status.body.connected && status.body.charges_enabled;
  if(!connected){
    box.innerHTML=`<div class="muted">Connect your Stripe account first (on the agency page) to bill this client.</div>`;
    return;
  }
  const def = ag && ag.default_client_retainer_cents;
  if(sub && sub.status && sub.status!=='canceled' && sub.status!=='draft'){
    const paused = sub.status==='paused';
    box.innerHTML=`<div style="display:grid;gap:6px;max-width:540px">
      <div><span class="tag ${paused?'warn':'booked'}">${esc(sub.status)}</span> <b>${__money(sub.retainer_cents)}/mo</b> · ${esc(sub.client_name||sub.client_email||'client')}</div>
      ${sub.status==='checkout_pending'?`<div class="meta">Waiting for the client to complete payment via the Checkout link.</div>`:''}
      <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">
        ${paused?`<button class="btn" onclick="__rbResume('${ghlLocationId}','${locationId}','${agencyId}')">Resume billing</button>`
                :`<button class="btn ghost" onclick="__rbPause('${ghlLocationId}','${locationId}','${agencyId}')">Pause billing</button>`}
      </div>
      <div id="rbLocMsg" class="msg" style="margin-top:10px;display:none"></div></div>`;
  } else {
    box.innerHTML=`<div style="display:grid;gap:12px;max-width:540px">
      <div class="meta">Rebilling is off for this location. Enable it to charge this client a flat monthly retainer — the charge goes 100% to your connected Stripe account.</div>
      <div><label class="meta">Client name</label><br><input id="rbName" type="text" autocomplete="off" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--s1);color:var(--white)"></div>
      <div><label class="meta">Client email</label><br><input id="rbEmail" type="email" autocomplete="off" placeholder="client@business.com" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--s1);color:var(--white)"></div>
      <div><label class="meta">Monthly retainer (USD)</label><br><input id="rbAmount" type="number" min="1" step="1" value="${def?(def/100):''}" placeholder="e.g. 500" style="width:160px;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--s1);color:var(--white)"></div>
      <div><button class="btn" onclick="__rbEnable('${ghlLocationId}','${locationId}','${agencyId}')">Enable & create payment link</button></div>
      <div id="rbLocMsg" class="msg" style="display:none"></div>
      <div id="rbLink"></div></div>`;
  }
};
window.__rbEnable = async function(ghlLocationId, locationId, agencyId){
  const name=(document.getElementById('rbName').value||'').trim();
  const email=(document.getElementById('rbEmail').value||'').trim();
  const amt=parseFloat(document.getElementById('rbAmount').value||'');
  const msg=document.getElementById('rbLocMsg');
  const show=(cls,t)=>{ if(msg){msg.style.display='block';msg.className='msg '+cls;msg.textContent=t;} };
  if(!email || !(amt>0)){ show('err','Client email and a positive retainer are required.'); return; }
  show('ok','Creating…');
  const r=await __rbPost({action:'enable_location', ghl_location_id:ghlLocationId, client_name:name, client_email:email, retainer_cents:Math.round(amt*100)});
  if(r.ok && r.body.ok && r.body.checkout_url){
    show('ok','✓ Enabled. Send this Checkout link to your client:');
    const box=document.getElementById('rbLink');
    if(box) box.innerHTML=`<div style="display:flex;gap:8px;margin-top:8px"><input readonly value="${esc(r.body.checkout_url)}" style="flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--s1);color:var(--white);font-size:12px"><button class="btn ghost" onclick="navigator.clipboard.writeText('${esc(r.body.checkout_url)}')">Copy</button></div>
      <div class="meta" style="margin-top:6px">The client pays on Stripe — they never need a FlatRateVoice login. Status updates here automatically once they pay.</div>`;
  } else {
    const e=(r.body&&r.body.error)||('failed ('+r.status+')');
    show('err', e==='connect_stripe_first'?'Connect your Stripe account first (agency page).':e==='stripe_onboarding_incomplete'?'Finish your Stripe setup first (agency page).':e);
  }
};
window.__rbPause = async function(ghlLocationId, locationId, agencyId){
  const r=await __rbPost({action:'pause', ghl_location_id:ghlLocationId});
  if(r.ok&&r.body.ok) __rbLoadLocation(ghlLocationId, locationId, agencyId);
};
window.__rbResume = async function(ghlLocationId, locationId, agencyId){
  const r=await __rbPost({action:'resume', ghl_location_id:ghlLocationId});
  if(r.ok&&r.body.ok) __rbLoadLocation(ghlLocationId, locationId, agencyId);
};

window.__saveLocationLanguage = async function(ghlLocationId, locationId, fromDrill){
  const sel = document.getElementById('locLang'), msg = document.getElementById('locLangMsg'),
        btn = document.getElementById('locLangSaveBtn');
  if(!sel) return;
  const lang = sel.value; if(btn) btn.disabled = true;
  const show=(cls,t)=>{ if(msg){ msg.style.display='block'; msg.className='msg '+cls; msg.textContent=t; } };
  try{
    const {data:{session}} = await sb.auth.getSession();
    const resp = await fetch(`https://api.flatratevoice.com/api/locations/${ghlLocationId}/language`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
      body: JSON.stringify({language: lang}) });
    const r = await resp.json();
    if(resp.ok && r.ok) show('ok','✓ Saved — greeting and follow-ups will use '+esc(r.language_name||lang)+'.');
    else show('err', r.error || ('Save failed ('+resp.status+').'));
  }catch(err){ show('err','Network error: '+err.message); }
  if(btn) btn.disabled = false;
};

/* ===== AGENT CONFIG DRAFT EDITOR (Live Testing Labs) ======================
   Draft-first: nothing here changes live call behaviour. Saving writes only to
   agent_config_drafts; Promote is a separate explicit action (not built yet).

   Two fields are deliberately not editable here:
     * primary_language -- POST /api/locations/{id}/language is its ONLY writer
       (the draft API rejects it outright). Shown read-only for context, with a
       pointer to the card that does own it.
     * persona_name -- editable and promotable, but nothing in the call path
       reads it yet, so it is labelled inactive rather than implying an effect
       it does not have.                                                      */
const AC_MODES = [['','Inherit agency default'],['off','Off'],
                  ['name','Greet by name'],['confirm','Confirm name']];
const acVal = m => (m === null || m === undefined) ? '' : m;

window.__acLoad = async function(ghl){
  const box = $('acBox'); if(!box) return;
  try{
    const {data:{session}} = await sb.auth.getSession();
    const H = {"Authorization":"Bearer "+session.access_token};
    const base = 'https://api.flatratevoice.com/api/locations/'+encodeURIComponent(ghl)+'/agent-config';
    const [lr, dr] = await Promise.all([fetch(base,{headers:H}), fetch(base+'/draft',{headers:H})]);
    const lj = await lr.json().catch(()=>({})), dj = await dr.json().catch(()=>({}));
    if(!lr.ok || !lj.ok){
      box.innerHTML = '<span class="muted">Couldn\'t load the agent config ('+esc(lj.error||('HTTP '+lr.status))+').</span>';
      return;
    }
    __acRender(ghl, lj.config||{}, (dj && dj.ok) ? dj.draft : null);

    +     '<select id="acMode" style="width:100%;padding:11px 13px;background:var(--s3);border:1px solid var(--border);'
    +     'border-radius:8px;color:var(--white);font-size:14px;outline:none">'+modeOpts+'</select>'
    +     '<div class="meta" style="margin-top:6px">Live: <b>'+esc(cur.caller_greeting_mode===null||cur.caller_greeting_mode===undefined?'inherit':cur.caller_greeting_mode)
    +     '</b>. &ldquo;Inherit&rdquo; is not the same as &ldquo;Off&rdquo; &mdash; it follows the agency default.</div></div>'

window.__acSave = async function(ghl){
  const btn = $('acSave'), msg = $('acMsg');
  const show = (cls,t)=>{ if(msg){ msg.className='msg '+cls; msg.innerHTML=t; } };
  if(btn) btn.disabled = true;
  try{
    const mode = $('acMode').value;
    const {data:{session}} = await sb.auth.getSession();
    // primary_language is deliberately absent -- the API rejects it, and sending it
    // would fail the whole save.
    const body = {
      system_prompt: $('acPrompt').value,
      persona_name:  $('acPersona').value,
      caller_greeting_mode: mode === '' ? null : mode     // '' means inherit, not 'off'
    };
    const resp = await fetch('https://api.flatratevoice.com/api/locations/'+encodeURIComponent(ghl)+'/agent-config/draft',
      {method:'PUT', headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
       body: JSON.stringify(body)});
    const r = await resp.json().catch(()=>({}));
    if(resp.ok && r.ok){ show('ok','&#10003; Draft saved. Nothing live has changed.'); __acLoad(ghl); }
    else show('err', esc(r.error || ('Save failed ('+resp.status+').')));
  }catch(e){ show('err','Network error: '+esc(e.message)); }
  if(btn) btn.disabled = false;
};

window.__acDiscard = async function(ghl){
  const btn = $('acDiscard'), msg = $('acMsg');
  const show = (cls,t)=>{ if(msg){ msg.className='msg '+cls; msg.innerHTML=t; } };
  if(!confirm('Discard this draft? The saved changes will be lost. Live configuration is unaffected.')) return;
  if(btn) btn.disabled = true;
  try{
    const {data:{session}} = await sb.auth.getSession();
    const resp = await fetch('https://api.flatratevoice.com/api/locations/'+encodeURIComponent(ghl)+'/agent-config/draft',
      {method:'DELETE', headers:{'Authorization':'Bearer '+session.access_token}});
    const r = await resp.json().catch(()=>({}));

    if(resp.ok && r.ok){ show('ok','&#10003; Draft discarded.'); __acLoad(ghl); }
    else show('err', esc(r.error || ('Discard failed ('+resp.status+').')));
  }catch(e){ show('err','Network error: '+esc(e.message)); }
  if(btn) btn.disabled = false;
};

/* Get feedback -- grades the draft against the locked 12-check rubric via
   POST .../agent-config/review, which shares its implementation with the
   assistant's review_draft_config tool so chat and button cannot diverge.

   READ-ONLY: suggestions, never an auto-applied edit. The operator decides.
   The on-screen values are sent so unsaved edits are graded, including a
   greeting mode of null (inherit) -- the endpoint treats an explicitly-present
   key as an override precisely so that case is not silently graded stale. */
const AC_VERDICT_TAG = { 'pass':'ok', 'fail':'over', 'n/a':'other' };
const AC_VERDICT_TXT = { 'pass':'PASS', 'fail':'NEEDS WORK', 'n/a':'N/A' };

window.__acReview = async function(ghl){
  const btn = $('acReview'), out = $('acReviewBox');
  if(!out) return;
  if(btn){ btn.disabled = true; btn.textContent = 'Reviewing…'; }
  out.innerHTML = '<div class="muted">Reviewing the draft against the coaching rubric… this takes a few seconds.</div>';
  try{
    const mode = $('acMode') ? $('acMode').value : '';
    const {data:{session}} = await sb.auth.getSession();
    const body = {
      system_prompt: $('acPrompt') ? $('acPrompt').value : '',
      persona_name:  $('acPersona') ? $('acPersona').value : '',
      caller_greeting_mode: mode === '' ? null : mode
    };
    const resp = await fetch('https://api.flatratevoice.com/api/locations/'+encodeURIComponent(ghl)+'/agent-config/review',
      {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
       body: JSON.stringify(body)});
    const r = await resp.json().catch(()=>({}));
    if(resp.status === 404){
      out.innerHTML = '<div class="msg err" style="display:block">There\'s no saved draft to review yet. Save a draft first, then get feedback.</div>';
    } else if(!resp.ok || !r.ok){
      out.innerHTML = '<div class="msg err" style="display:block">'+esc(r.error || ('Review failed ('+resp.status+').'))+'</div>';
    } else {
      __acRenderReview(r);
    }
  }catch(e){
    out.innerHTML = '<div class="msg err" style="display:block">Network error: '+esc(e.message)+'</div>';
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Get feedback'; }
};

window.__acRenderReview = function(r){
  const out = $('acReviewBox'); if(!out) return;
  const sum = r.summary || {};
  const tools = (r.location && r.location.booking_tools_enabled) || [];

  let h = '<div class="card" style="margin-bottom:0;background:var(--s1)">'
    + '<div class="card-hd"><h3>Draft feedback</h3><span class="meta">'
    + '<span class="tag ok">'+(sum['pass']||0)+' pass</span> '
    + '<span class="tag over">'+(sum['fail']||0)+' needs work</span> '
    + '<span class="tag other">'+(sum['n/a']||0)+' n/a</span>'
    + '</span></div><div style="padding:16px 20px">';

  if(r.truncation_notice)
    h += '<div class="msg err" style="display:block">'+esc(r.truncation_notice)+'</div>';

  // State the model was graded against, so a surprising verdict is explainable
  // rather than mysterious.
  h += '<div class="meta" style="margin-bottom:14px">Graded against: vertical <b>'
    + esc((r.location && r.location.vertical) || 'unknown') + '</b> · booking tools <b>'
    + esc(tools.length ? tools.join(', ') : 'not enabled') + '</b> · greeting mode <b>'
    + esc((r.reviewed && r.reviewed.caller_greeting_mode) || 'inherit') + '</b></div>';

  (r.categories || []).forEach(cat => {
    h += '<div style="margin-bottom:16px"><div style="font-size:11px;font-weight:600;letter-spacing:.05em;'
      + 'text-transform:uppercase;color:var(--slate4);margin-bottom:8px">'
      + esc(cat.category) + ' — ' + esc(cat.name) + '</div>';
    (cat.checks || []).forEach(c => {
      const tag = AC_VERDICT_TAG[c.verdict] || 'other';
      h += '<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)">'
        + '<span class="tag '+tag+'" style="flex:none;min-width:86px;text-align:center">'
        + (AC_VERDICT_TXT[c.verdict] || esc(c.verdict)) + '</span>'
        + '<div><div style="color:var(--slate2);font-size:13px">'+esc(c.check)+'</div>'
        + '<div class="meta" style="margin-top:2px">'+esc(c.note||'')+'</div></div></div>';
    });
    h += '</div>';
  });

  h += '<div class="meta">'+esc(r.advisory || 'Suggestions only — nothing has been changed.')+'</div>';
  h += '</div></div>';
  out.innerHTML = h;
};

function embedMsgFor(v){ const b=v.body||{}; if(b.error) return b.error; if(v.status===401) return 'We could not verify your GoHighLevel session.'; return 'Something went wrong ('+v.status+').'; }

// Copy of GHL's confirmed Custom Page handshake (REQUEST_USER_DATA →
// REQUEST_USER_DATA_RESPONSE). We don't origin-check the reply: white-label
// agencies frame this under their own domains, so the trust boundary is the
// encrypted payload the edge function decrypts, not the frame origin.
function requestGhlSso(timeoutMs=8000){
  return new Promise((resolve,reject)=>{
    let done=false;
    const onMsg=({data})=>{
      if(data && data.message==='REQUEST_USER_DATA_RESPONSE'){
        done=true; window.removeEventListener('message',onMsg); resolve(data.payload);
      }
    };
    window.addEventListener('message',onMsg);
    window.parent.postMessage({message:'REQUEST_USER_DATA'},'*');
    setTimeout(()=>{ if(!done){ window.removeEventListener('message',onMsg); reject(new Error('No SSO response from the GoHighLevel window.')); } },timeoutMs);
  });
}
async function postSso(payload){
  const res=await fetch(SSO_FN,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
    body:JSON.stringify(payload)
  });
  let body=null; try{ body=await res.json(); }catch{}
  return {ok:res.ok,status:res.status,body:body||{}};
}
async function agencyEmbedFlow(){
  embedStatus('Verifying your GoHighLevel session…');
  try{
    const encryptedData=await requestGhlSso();
    const v=await postSso({action:'verify',encryptedData});
    if(v.status===200 && v.body.linked===true){
      const {error}=await sb.auth.verifyOtp({token_hash:v.body.session_token_hash,type:'magiclink'});
      if(error) return embedError('Could not establish your session. '+error.message);
      EMBED_VERIFIED=true;
      return boot();
    }
    if(v.status===200 && v.body.needs_link===true){
      return embedIssueCode(encryptedData);
    }
    return embedError(embedMsgFor(v));
  }catch(e){ return embedError(e.message||'SSO handshake failed.'); }
}

// magic-link email opens a fresh top-level tab, never back into this frame, and
// in-iframe Supabase storage is increasingly partitioned by browsers. Instead
// the edge fn mints a one-time code (bound server-side to this GHL company);
// the admin enters it in the normal, fully-authenticated dashboard.

  // history), not live monitoring. A background re-render there yanks whatever
  // you're mid-way through reading off the screen. Use the header refresh button
  // instead; the overview and agency views still auto-refresh normally.
  if(PROFILE && !document.hidden && !editing && !window.__fwdInstructionsOpen && !window.__onLocationView && !window.__agyGhlEditing && !window.__brandEditing) render(); }, 300000); }
}

function poolCalc(row){
  const t=TIER[row.plan]||TIER.starter, used=Number(row.minutes_used||0);
  const pct=Math.min(100,Math.round(used/t.pool*100)), over=Math.max(0,used-t.pool);
  return {t,used,pct,over,bill:t.price+over*t.ovg,status:over>0?'over':pct>=85?'warn':'ok'};
}
// Exact dollars. money() rounds to whole dollars, which is fine for an estimate
// but wrong for a real invoice total -- $304.87 must not render as "$305".
const money2=n=>'$'+Number(n||0).toFixed(2);
// Minute figures on the billing card. fmt() rounds to whole numbers, which
// silently turns a 112.41-minute overage into "112 min" -- the same truncation
// we refuse to accept from Stripe's invoice `quantity` field. Keep 2 decimals.
const mins=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});

// Turn the agency-billing response into what the pool card renders. When Stripe
// has real figures they win outright; otherwise the old client-side estimate is
// kept but labelled as an estimate, so a cosmetic number is never mistakable
// for a charge.
//
// NOTE: overage minutes come from b.overage_minutes (derived from the Stripe
// METER SUMMARY) and overage dollars from b.overage_amount_cents (summed from
// invoice line `amount`). The invoice line's `quantity` field is deliberately
// never used anywhere -- Stripe truncates it to an integer, so a 112.41-minute
// overage would display as 112.
function __buildBill(p, b){
  // timeZone:'UTC' -- Stripe period bounds are UTC midnights, and rendering
  // them in local time shifts every date back a day west of Greenwich.
  const dt=d=>d?new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',timeZone:'UTC'}):'?';
  if(b && b.ok && b.on_metered_billing){
    const pool=Number(b.included_minutes||p.t.pool);
    const used=Number(b.minutes_recorded||0);
    const over=Number(b.overage_minutes||0);
    const rate=Number(b.overage_rate_cents||0)/100;
    const overAmt=Number(b.overage_amount_cents||0)/100;
    const total=Number(b.upcoming_total_cents||0)/100;
    // usage_daily is live; the meter only has fully-closed days. Showing the
    // gap stops "my dashboard says 40 minutes but Stripe says 12" tickets.
    const lag=Math.max(0, used-Number(b.minutes_metered||0));
    return {
      live:true, used, pool, over, pct:Math.min(100,pool?Math.round(used/pool*100):0),
      base:Number(b.base_amount_cents||0)/100, rate, totalText:money2(total),
      periodLabel:`billing period ${dt(b.period&&b.period.start)} – ${dt(b.period&&b.period.end)}`,
      usedSub:'of '+mins(pool)+' pooled · this billing period',
      billSub:over>0?'incl. '+mins(over)+' min overage ('+money2(overAmt)+')':'within pool',
      footnote:`Charged automatically by Stripe at the end of this billing period.`
        + (over>0?` Overage: ${over.toFixed(2)} min × $${rate.toFixed(2)} = ${money2(overAmt)}.`:'')
        + (lag>0.005?` ${lag.toFixed(2)} min recorded since the last nightly report aren't metered yet.`:'')
        + (b.meter_error?` Meter read failed: ${esc(b.meter_error)}.`:'')
        + (b.invoice_error?` Invoice preview failed: ${esc(b.invoice_error)}.`:'')
    };
  }
  // On the estimate. Distinguish an EXPECTED estimate (Stripe says this agency
  // isn't on metered billing -- b.ok with a reason) from a FAILURE to reach
  // live billing (empty {}, {__billErr} from a rejected fetch, or an {ok:false}
  // error response). The two looked identical during the apikey-preflight
  // regression, which is why it went unnoticed -- so make the failure loud in
  // the console and visible on the card.
  const reached = !!(b && b.ok);
  const errored = !reached;
  const detail = b && (b.__billErr || b.error);
  if(errored) console.warn('[billing] calendar-month estimate shown; live billing not loaded:', detail||'(empty response)', b);
  return {
    live:false, loadError:errored, used:p.used, pool:p.t.pool, over:p.over, pct:p.pct,
    base:p.t.price, rate:p.t.ovg, totalText:money(p.bill),
    periodLabel:'calendar month',
    usedSub:'of '+mins(p.t.pool)+' pooled · calendar month',
    billSub:p.over>0?'estimate · incl. '+mins(p.over)+' min overage':'estimate · within pool',
    footnote:'<b>Estimate only</b> — '+(errored?'couldn’t load live billing':'not on metered billing')
      + (!errored&&b&&b.reason?` (${esc(b.reason)})`:'')
      + (errored&&detail?` (${esc(detail)})`:'')
      + ', so nothing here is charged automatically. Figures are calendar-month, not a Stripe billing period.'
  };
}
function kpi(l,v,d,cls){return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${d?`<div class="d ${cls||''}">${d}</div>`:''}</div>`}

/* ---------- ROUTER ---------- */
async function render(){
  // resolve active product against what this user actually has enabled
  const enabled = PRODUCTS.length?PRODUCTS:[BRAND.primary];
  let ap = NAV.product;
  if(!enabled.includes(ap)) ap = enabled.includes(BRAND.primary)?BRAND.primary:enabled[0];
  NAV.product = ap;
  return ap==='frc' ? renderFRC() : renderFRV();
}
function renderFRV(){
  const r=PROFILE.role;
  if(r==='super_admin'){
    if(NAV.location) return clientView(NAV.location,true);
    if(NAV.agency) return agencyView(NAV.agency,true);
    return adminHome();
  }
  if(r==='agency_admin'){
    if(NAV.location) return clientView(NAV.location,true);
    return agencyView(PROFILE.agency_id,false);
  }
  return clientView(PROFILE.location_id,false); // client_user
}
function renderFRC(){
  const r=PROFILE.role;
  if(r==='super_admin'){
    if(NAV.location) return clientViewFRC(NAV.location,true);
    if(NAV.agency) return agencyViewFRC(NAV.agency,true);
    return adminHomeFRC();
  }
  if(r==='agency_admin'){
    if(NAV.location) return clientViewFRC(NAV.location,true);
    return agencyViewFRC(PROFILE.agency_id,false);
  }
  return clientViewFRC(PROFILE.location_id,false); // client_user
}
window.__go=(t,id)=>{NAV[t]=id;render();};
window.__back=()=>{ if(NAV.location) delete NAV.location; else delete NAV.agency; render(); };

    <td><span class="tag ${p.status}">${p.over>0?'Over':p.status==='warn'?'85%+':'Healthy'}</span></td>
    <td class="mono">${money(p.bill)}</td></tr>`;}).join('');
  $('view').innerHTML=`
    <div class="viewhead"><div><div class="crumbs">All agencies</div><h1>Platform overview</h1><div class="sub">Every agency, every client location, live usage.</div></div><span class="pill">SUPER ADMIN</span></div>
    <div class="kpis">${kpi('Agencies',(ags||[]).length,'')}${kpi('Client locations',(locs||[]).length,'live')}${kpi('Minutes this month',fmt(totalMin),'all agencies')}${kpi('Projected revenue',money(mrr),'estimate · calendar month'+(overN?' · '+overN+' in overage':''),overN?'a':'g')}</div>
    <div class="card"><div class="card-hd"><h3>Agencies</h3><span class="meta">click a row to drill in</span></div>
    <table><thead><tr><th>Agency</th><th>Plan</th><th>Clients</th><th>Minutes</th><th>Pool</th><th>Status</th><th>Est. bill</th></tr></thead><tbody>${rows||'<tr><td colspan=7 class="muted" style="padding:20px">No agencies yet.</td></tr>'}</tbody></table></div>
    ${callsCard(calls,true)}`;
}

// Redeem the one-time code shown on the GHL Custom Page (/agency-embed). Always
// passes agency_id = the agency being viewed: for a super_admin that's the
// drilled-in agency (edge fn requires it); for an agency_admin the edge fn
// ignores it and infers their own agency anyway.
window.__connectGhl = async function(agencyId){
  const el = $('ghlCodeInput'), msg = $('ghlConnectMsg');
  const code = (el && el.value || '').trim();
  if(!code){ if(msg) msg.textContent = 'Enter the code shown on the GoHighLevel screen.'; return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ if(msg) msg.textContent = 'Your session expired — refresh and sign in again.'; return; }
  if(msg) msg.textContent = 'Connecting…';
  try{
    const res = await fetch(SSO_FN, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+session.access_token },
      body: JSON.stringify({ action:'redeem_link_code', code, supabase_access_token:session.access_token, agency_id:agencyId })
    });
    let body={}; try{ body=await res.json(); }catch{}
    if(res.status===200 && body.linked){ if(msg) msg.textContent = '✓ Connected! GoHighLevel is now linked to this agency.'; setTimeout(()=>render(),1200); return; }
    if(msg) msg.textContent = body.error || ('Could not connect ('+res.status+').');
  }catch(err){ if(msg) msg.textContent = 'Network error: '+err.message; }
};

window.__submitAddLoc = async function(e, agencyId, fromAdmin){
  e.preventDefault();
  const name = document.getElementById("newLocName").value.trim();
  const vertical = document.getElementById("newLocVertical").value;
  const area = document.getElementById("newLocArea").value.trim();
  const numSource = document.getElementById("newLocNumSource").value;
  const origNumber = document.getElementById("newLocOrig").value.trim();
  const msgEl = document.getElementById("newLocMsg");
  const btn = document.getElementById("newLocSubmit");
  if(!name || !vertical){ msgEl.textContent = "Business name and vertical are required."; return false; }
  if(numSource === "keep" && !origNumber){ msgEl.textContent = "Enter your current business number to forward from."; return false; }
  btn.disabled = true; btn.textContent = "Provisioning…"; msgEl.textContent = "";
  try{
    const {data:{session}} = await sb.auth.getSession();
    const body = {business_name:name, vertical};
    if(area) body.area_code = area;
    if(numSource === "keep"){ body.keep_number = true; body.original_number = origNumber; }
    if(PROFILE.role === "super_admin") body.agency_id = agencyId;
    const resp = await fetch("https://api.flatratevoice.com/api/locations", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},
      body: JSON.stringify(body)
    });
    const result = await resp.json();
    if(!resp.ok || !result.ok){
      msgEl.textContent = "Error: " + (result.error || "unknown error");
      btn.disabled = false; btn.textContent = "Add Location";
      return false;
    }
    if(result.keep_number){
      __renderForwardingInstructions(result.twilio_number, result.forwarded_from_number, agencyId, fromAdmin);
    } else {
      msgEl.textContent = "Success — provisioned " + result.twilio_number + ". Refreshing…";
      setTimeout(()=>agencyView(agencyId, fromAdmin), 1200);
    }
  }catch(err){
    msgEl.textContent = "Network error: " + err.message;
    btn.disabled = false; btn.textContent = "Add Location";
  }
  return false;
}

function callsCard(calls,showLoc){

    const label={booked:'Booked',message:'Message',no_booking:'No booking',transferred:'Transferred',other:'Handled'}[c.outcome]||c.outcome;
    return `<tr><td class="muted">${timeAgo(new Date(c.started_at))}</td><td class="mono">${esc(c.from_number||'')}</td><td class="mono">${dur}</td><td><span class="tag ${c.outcome}">${label}</span></td></tr>`;

}
function timeAgo(d){const s=(Date.now()-d.getTime())/1000;if(s<3600)return Math.max(1,Math.floor(s/60))+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}

/* ---------- GHL CONTACT RECOGNITION ---------- */
// Shared helpers. __ghlMsg/__ghlPost are module-scoped (only called from the
// window.* handlers below). The window.* handlers are what the inline onclick
// attributes reach, matching the existing window.__ wiring in this file.
function __ghlMsg(elId, html, kind){
  const m = $(elId); if(!m) return;
  m.className = 'msg'; m.style.display = 'block'; m.style.background=''; m.style.color='';
  if(kind==='err'){ m.className='msg err'; }
  else if(kind==='ok'){ m.className='msg ok'; }
  else if(kind==='warn'){ m.style.background='rgba(255,200,97,.1)'; m.style.color='var(--amber)'; }
  else { m.style.background='var(--s3)'; m.style.color='var(--slate2)'; }
  m.innerHTML = html;
}
async function __ghlPost(url, body){
  const {data:{session}} = await sb.auth.getSession();
  const resp = await fetch(url, {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},
    body: JSON.stringify(body)
  });
  let result = {};
  try{ result = await resp.json(); }catch(e){ /* non-JSON / empty body */ }
  return {resp, result};
}
// Authenticated GET against the API. Used for state that lives in the API's own
// Postgres rather than in Supabase, so it can't be read with sb.from(...).
async function __apiGet(url, extraHeaders){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return {};
  const headers = Object.assign({"Authorization":"Bearer "+session.access_token}, extraHeaders||{});
  const resp = await fetch(url, {headers});
  // Edge functions return a JSON body on 4xx too (e.g. {ok:false,reason:...}),
  // and the billing card needs that reason to explain itself. Parse regardless.
  try{ return await resp.json(); }catch(e){ return {}; }
}
// Build a credentials payload from a pit/cid/mode tri.  Returns {error} when the
// pair is half-filled, or {body} ready to POST.  pit + contacts_location_id must
// travel together; greeting_mode alone is allowed (no credential change).
function __ghlBuildBody(pit, cid, mode, saveAnyway){
  const hasPit = pit.length>0, hasCid = cid.length>0;
  if(hasPit !== hasCid){
    return {error:"Enter the PIT and Sub-Account ID together — or leave both blank. You filled in only one."};
  }
  const body = { greeting_mode: mode };
  if(hasPit && hasCid){ body.pit = pit; body.contacts_location_id = cid; }
  if(saveAnyway) body.save_anyway = true;
  return {body};
}

/* ============================================================
   FLATRATECOMPUTE (FRC) VIEWS
   FRC bills per concurrent lane (flat rate, tokens unmetered).
   frc_usage_daily (requests + tokens by fast/standard/heavy) is
   shown as throughput telemetry, NOT as a billing meter.
   ============================================================ */
const fmtTok = n => { n=Number(n||0); if(n>=1e9) return (n/1e9).toFixed(1)+'B'; if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1)+'M'; if(n>=1e3) return (n/1e3).toFixed(0)+'k'; return String(Math.round(n)); };
const TIERS = ['fast','standard','heavy'];
function monthStartUTC(){ const d=new Date(); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)).toISOString().slice(0,10); }
function tierAgg(rows){ const T={fast:{r:0,i:0,o:0},standard:{r:0,i:0,o:0},heavy:{r:0,i:0,o:0}}; (rows||[]).forEach(x=>{ const t=T[x.tier]; if(!t) return; t.r+=Number(x.requests||0); t.i+=Number(x.tokens_in||0); t.o+=Number(x.tokens_out||0); }); return T; }
function tierTable(T){
  const rows = TIERS.map(k=>{ const t=T[k]; return `<tr><td class="name" style="text-transform:capitalize">${k}</td><td class="mono">${fmt(t.r)}</td><td class="mono">${fmtTok(t.i)}</td><td class="mono">${fmtTok(t.o)}</td></tr>`; }).join('');
  return `<div class="card"><div class="card-hd"><h3>Throughput by tier</h3><span class="meta">this month · fast / standard / heavy</span></div>
    <table><thead><tr><th>Tier</th><th>Requests</th><th>Tokens in</th><th>Tokens out</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

  wrap.id = 'ax-root';
  wrap.innerHTML = `
    <button id="ax-fab" title="Account assistant">💬</button>
    <div id="ax-panel" role="dialog" aria-label="Account assistant">
      <div id="ax-hd"><div><b>Account assistant</b><div class="sub">Manage your account by chatting</div></div>
        <button id="ax-close" title="Close">✕</button></div>
      <div id="ax-log"></div>
      <form id="ax-form"><textarea id="ax-in" rows="1" placeholder="Ask or tell me what to do…"></textarea>
        <button id="ax-send" type="submit">Send</button></form>
    </div>`;
  document.body.appendChild(wrap);

  const panel=$('ax-panel');
  $('ax-fab').onclick=()=>{ window.__ax.open=!window.__ax.open; panel.classList.toggle('open',window.__ax.open);
    if(window.__ax.open){ if(!$('ax-log').childElementCount) __axSystem("Hi! I can look up locations, usage, billing and transcripts, and — with your confirmation — add a location, set a greeting mode, connect GoHighLevel, or update widget branding. What do you need?"); $('ax-in').focus(); } };
  $('ax-close').onclick=()=>{ window.__ax.open=false; panel.classList.remove('open'); };
  $('ax-form').addEventListener('submit',e=>{ e.preventDefault(); __axSend(); });
  $('ax-in').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); __axSend(); } });
  $('ax-in').addEventListener('input',e=>{ e.target.style.height='auto'; e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'; });
}

function __axBubble(cls,text){ const d=document.createElement('div'); d.className='ax-msg '+cls; d.textContent=text; $('ax-log').appendChild(d); $('ax-log').scrollTop=$('ax-log').scrollHeight; return d; }
function __axSystem(text){ __axBubble('ax-sys',text); }

// The agency currently in view — sent so a super_admin isn't asked to name it
// every message. agency_admin is always scoped to their own agency server-side.
function __axAgencyCtx(){ return (PROFILE && PROFILE.role==='super_admin') ? (NAV.agency||undefined) : undefined; }

async function __axPost(payload){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ __axSystem('Your session expired — please sign in again.'); return null; }
  const ctx=__axAgencyCtx();
  const res = await fetch(ASSISTANT_API,{ method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
    body: JSON.stringify({...payload, ...(ctx?{agency_id:ctx}:{})}) });
  let body={}; try{ body=await res.json(); }catch{}
  return { status:res.status, body };
}

function __axSetBusy(b){ window.__ax.busy=b; const s=$('ax-send'); if(s) s.disabled=b; }

async function __axSend(){
  if(window.__ax.busy) return;
  const inEl=$('ax-in'); const text=(inEl.value||'').trim(); if(!text) return;
  inEl.value=''; inEl.style.height='auto';
  __axBubble('ax-user',text);
  __axSetBusy(true); const thinking=__axBubble('ax-bot','…');
  try{
    const r = await __axPost({ message:text, history: window.__ax.history });
    thinking.remove();
    if(!r){ __axSetBusy(false); return; }
    if(r.status!==200 || !r.body || r.body.ok===false){ __axBubble('ax-bot','Sorry — '+((r.body&&r.body.error)||('request failed ('+r.status+')'))); __axSetBusy(false); return; }
    __axHandle(r.body);
  }catch(err){ thinking.remove(); __axBubble('ax-bot','Network error: '+err.message); }
  __axSetBusy(false);
}

// A chat-turn response: either a plain message, or a write proposal to confirm.
function __axHandle(body){
  if(Array.isArray(body.history)) window.__ax.history = body.history;
  if(body.assistant) __axBubble('ax-bot', body.assistant);
  if(body.mode==='confirm' && body.pending_action){ window.__ax.pending=body.pending_action; __axRenderConfirm(body.pending_action); }
}

function __axRenderConfirm(pa){
  const card=document.createElement('div'); card.className='ax-confirm';
  const args=Object.entries(pa.input||{}).map(([k,v])=>`${k}: ${v}`).join('\n');
  card.innerHTML=`<div class="act"><b>${esc(pa.tool)}</b>${args?'\n'+esc(args):''}</div>
    <div class="row"><button class="ax-yes">Confirm</button><button class="ax-no">Cancel</button></div>`;
  card.querySelector('.ax-yes').onclick=()=>__axConfirm(card,true);
  card.querySelector('.ax-no').onclick=()=>__axConfirm(card,false);
  $('ax-log').appendChild(card); $('ax-log').scrollTop=$('ax-log').scrollHeight;
}

async function __axConfirm(card, go){
  if(window.__ax.busy) return;
  const pa=window.__ax.pending; if(!pa) return;
  card.querySelectorAll('button').forEach(b=>b.disabled=true);
  __axSetBusy(true);
  try{
    if(!go){
      // Cancel: tell the model the user declined, so it acknowledges instead of
      // waiting on a tool_result that never comes.
      window.__ax.history.push({ role:'user', content:[{ type:'tool_result', tool_use_id:pa.tool_use_id, content:'The user cancelled this action. Do not perform it.' }] });
      window.__ax.pending=null; card.remove(); __axSystem('Cancelled.');
      const r=await __axPost({ history: window.__ax.history }); if(r&&r.status===200&&r.body) __axHandle(r.body);
      __axSetBusy(false); return;
    }
    const ex=await __axPost({ confirm: pa });
    window.__ax.pending=null; card.remove();
    if(!ex || ex.status!==200 || !ex.body){ __axBubble('ax-bot','Could not run that action ('+((ex&&ex.status)||'network')+').'); __axSetBusy(false); return; }
    const ok = ex.body.result && ex.body.result.ok;
    __axSystem(ok ? '✓ Done.' : '⚠ '+((ex.body.result&&(ex.body.result.message||ex.body.result.error))||'the action did not complete'));
    if(ex.body.tool_result_message){
      window.__ax.history.push(ex.body.tool_result_message);
      const r=await __axPost({ history: window.__ax.history }); if(r&&r.status===200&&r.body) __axHandle(r.body);
    }
    // A successful write changes state the dashboard shows — refresh it underneath.
    if(ok && typeof render==='function') render();
  }catch(err){ __axBubble('ax-bot','Error: '+err.message); }
  __axSetBusy(false);
}

boot();
</script>
</body>
</html>
